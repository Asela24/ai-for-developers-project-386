openapi: 3.0.0
info:
  title: EasyBook
  version: 0.0.0
tags:
  - name: Event types
  - name: Slots
  - name: Bookings
paths:
  /bookings:
    post:
      operationId: createBooking
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBooking'
    get:
      operationId: listUpcomingBookings
      description: 'Upcoming Bookings of every Event type: the interval has not ended yet.'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnerBooking'
      tags:
        - Bookings
  /bookings/{id}:
    delete:
      operationId: deleteBooking
      description: 'Owner deletes a Booking: its interval is free at once for every Event type. An unknown id is a data error.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
      tags:
        - Bookings
  /event-types:
    get:
      operationId: listEventTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
      tags:
        - Event types
    post:
      operationId: createEventType
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
      tags:
        - Event types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventType'
  /event-types/{eventTypeId}:
    delete:
      operationId: deleteEventType
      description: Deletes the Event type and every Booking of it, ended ones included.
      parameters:
        - name: eventTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
      tags:
        - Event types
  /event-types/{eventTypeId}/slots:
    get:
      operationId: listSlots
      parameters:
        - name: eventTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
      tags:
        - Slots
components:
  schemas:
    Booking:
      type: object
      required:
        - eventTypeId
        - start
        - end
        - guestName
        - guestEmail
      properties:
        eventTypeId:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
      description: 'What the Guest gets back on create: no id, so nothing to delete the Booking with.'
    CreateBooking:
      type: object
      required:
        - eventTypeId
        - start
        - guestName
        - guestEmail
      properties:
        eventTypeId:
          type: string
          minLength: 1
          maxLength: 64
        start:
          type: string
          format: date-time
          description: Must be the start of an offered Slot of that Event type.
        guestName:
          type: string
          minLength: 1
          maxLength: 120
        guestEmail:
          type: string
          minLength: 1
          maxLength: 254
          pattern: ^[^@]+@[^@]+$
          description: One `@` with text on both sides.
    CreateEventType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 540
    EventType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 540
    Failure:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - data_error
            - conflict
        message:
          type: string
    OwnerBooking:
      type: object
      required:
        - id
        - eventTypeId
        - start
        - end
        - guestName
        - guestEmail
      properties:
        id:
          type: string
          description: Stable identifier of this Booking, assigned on create.
        eventTypeId:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
      description: A Booking as the Owner reads it, with the id that deletes it.
    Slot:
      type: object
      required:
        - start
        - end
        - status
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - free
            - busy
      description: A start offered for one Event type. A busy Slot carries no Guest identity.
